<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi colección | Mi biblioteca</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor">
            <nav class="navegacion"><a href="index.html">Inicio</a> · <a href="catalogo.html">Catálogo</a> · <a href="cuenta.html">Mi cuenta</a></nav>
            <h1>Mi colección</h1>
            <p class="subtitulo">Tus películas y series, organizadas por estado.</p>
        </div>
    </header>

    <main class="contenedor">
        <section class="panel" aria-labelledby="titulo-coleccion">
            <h2 id="titulo-coleccion">Títulos guardados</h2>
            <p id="mensaje-biblioteca" class="mensaje" role="status" aria-live="polite"></p>
            <form id="filtros-biblioteca" class="formulario fila" aria-label="Filtrar mi biblioteca">
                <div>
                    <label for="filtro-genero-biblioteca">Género</label>
                    <select id="filtro-genero-biblioteca"><option value="">Todos los géneros</option></select>
                </div>
                <div>
                    <label for="filtro-anio-biblioteca">Año de estreno</label>
                    <input id="filtro-anio-biblioteca" type="number" min="1" inputmode="numeric">
                </div>
                <div>
                    <label for="filtro-estado-biblioteca">Estado</label>
                    <select id="filtro-estado-biblioteca">
                        <option value="">Cualquier estado</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="VISTO">Visto</option>
                        <option value="ABANDONADO">Abandonado</option>
                    </select>
                </div>
                <button type="submit">Buscar</button>
                <button id="limpiar-filtros-biblioteca" type="button" class="secundario">Limpiar</button>
            </form>
            <ul id="lista-biblioteca" class="coleccion" aria-live="polite">
                <li class="cargando">Cargando tu colección...</li>
            </ul>
        </section>

        <section class="panel" aria-labelledby="titulo-catalogo">
            <h2 id="titulo-catalogo">Añadir desde el catálogo</h2>
            <p class="ayuda">Elige el estado de una película o serie desde su ficha en el catálogo.</p>
            <a class="boton-enlace" href="catalogo.html">Ir al catálogo</a>
        </section>
    </main>

    <script src="js/biblioteca.js"></script>
</body>
</html>
