spring.application.name=biblioteca

# Base de datos H2 guardada en la carpeta ./data del proyecto.
# Los datos se conservan entre arranques. Para empezar de cero, borrad la carpeta data/.
spring.datasource.url=jdbc:h2:file:./data/biblioteca
spring.datasource.username=sa
spring.datasource.password=

# Hibernate adapta las tablas a las entidades al arrancar (sin borrar datos).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
